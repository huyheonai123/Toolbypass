<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYPASS LINK TOOL - GITHUB EDITION</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }
        .container {
            background-color: #1a001a;
            border: 2px solid #ff00ff;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 0 20px #ff00ff;
            text-align: center;
        }
        #key-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .key-box {
            background: #260026;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff007f;
            width: 85%;
            max-width: 350px;
        }
        .key-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #110011;
            border: 1px solid #ff00ff;
            color: #fff;
            border-radius: 5px;
            text-align: center;
            outline: none;
        }
        .key-box button {
            background: linear-gradient(90deg, #ff007f, #ff00ff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        #message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        h2 {
            font-size: 20px;
            color: #ff66cc;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 11px;
            color: #ff99ff;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 13px;
            text-align: left;
            margin-bottom: 8px;
            color: #ffccff;
        }
        .grid-sites {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .site-btn {
            background: #330033;
            border: 1px solid #ff00ff;
            color: white;
            padding: 8px 5px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .site-btn.active {
            background: #ff007f;
            border-color: #ffffff;
            box-shadow: 0 0 8px #ff007f;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 35px;
            background: #110011;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .bypass-btn {
            background: linear-gradient(90deg, #ff007f, #ff00ff);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007f;
        }
        .console-box {
            margin-top: 15px;
            background: #0a000a;
            border: 1px solid #440044;
            border-radius: 5px;
            padding: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 11px;
            height: 100px;
            overflow-y: auto;
            color: #00ff00;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Màn hình nhập Key bảo mật -->
    <div id="key-modal">
        <div class="key-box">
            <h3>🔑 XÁC THỰC KEY TOOL</h3>
            <p style="font-size:11px; color:#ff99ff;">Nhập key: keybypasstoolpro</p>
            <input type="text" id="key-input" placeholder="Dán key vào đây...">
            <button onclick="verifyKey()">MỞ KHÓA</button>
            <div id="message"></div>
        </div>
    </div>

    <!-- Giao diện chính của Tool -->
    <div class="container" id="main-tool" style="display: none;">
        <h2>⚡ BYPASS LINK TOOL ⚡</h2>
        <div class="subtitle">Chọn site xác nhận – Dán URL – Nhận VƯỢT LINK</div>

        <div class="section-title">🔗 CHỌN SITE TRÊN ĐỂ XÁC NHẬN</div>
        <div class="grid-sites">
            <button class="site-btn" onclick="selectSite(this, 'Gtraffic.io')">Gtraffic.io</button>
            <button class="site-btn" onclick="selectSite(this, 'Link4m')">Link4m</button>
            <button class="site-btn" onclick="selectSite(this, 'Layma.net')">Layma.net</button>
            <button class="site-btn" onclick="selectSite(this, 'Traffic4k.com')">Traffic4k.com</button>
            <button class="site-btn" onclick="selectSite(this, 'Site2s.com')">Site2s.com</button>
            <button class="site-btn" onclick="selectSite(this, 'Bbmkt.com')">Bbmkt.com</button>
            <button class="site-btn" onclick="selectSite(this, 'Ontop.link')">Ontop.link</button>
            <button class="site-btn" onclick="selectSite(this, 'Link999.win')">Link999.win</button>
        </div>

        <div class="section-title">🌐 DÁN URL CỦA WEB CẦN VƯỢT LINK</div>
        <div class="input-group">
            <span class="input-icon">🔗</span>
            <input type="text" id="target-url" placeholder="https://...">
        </div>

        <button class="bypass-btn" onclick="startBypass()">✨ VƯỢT LINK</button>

        <div class="console-box" id="console">
            [Trạng thái]: Sẵn sàng kết nối...<br>
        </div>
    </div>

    <script>
        function verifyKey() {
            const inputKey = document.getElementById('key-input').value.trim();
            const msg = document.getElementById('message');
            
            if (inputKey === "keybypasstoolpro") {
                msg.style.color = "#00ff00";
                msg.innerText = "Key thành công!";
                setTimeout(() => {
                    document.getElementById('key-modal').style.display = 'none';
                    document.getElementById('main-tool').style.display = 'block';
                }, 800);
            } else {
                msg.style.color = "#ff3333";
                msg.innerText = "Key lỗi ko đúng";
            }
        }

        let selectedSiteName = "";
        function selectSite(element, name) {
            document.querySelectorAll('.site-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedSiteName = name;
        }

        async function startBypass() {
            const url = document.getElementById('target-url').value.trim();
            const consoleBox = document.getElementById('console');
            
            if(!selectedSiteName) {
                alert("Mẹ kiếp, chưa chọn site kìa boss man!");
                return;
            }
            if(!url) {
                alert("Chưa dán URL vào ô kìa boss man!");
                return;
            }

            consoleBox.style.display = 'block';
            consoleBox.innerHTML = `[Trạng thái]: Đang khởi tạo tiến trình...<br>`;
            consoleBox.innerHTML += `[IP Thiết bị]: 192.168.1.100 (Client Simulation)<br>`;
            consoleBox.innerHTML += `[+] Đang kết nối tới ${selectedSiteName}...<br>`;

            setTimeout(() => {
                consoleBox.innerHTML += `[+] Đang giải mã các lớp token và vượt qua tường lửa...<br>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }, 1000);

            setTimeout(() => {
                // Tạo link giả lập kết quả trả về sạch sẽ cho boss man
                const simulatedResult = `https://www.mediafire.com/file/example_output/file.zip`;
                consoleBox.innerHTML += `<span style="color: #00ffff; font-weight: bold;">[BYPASS THÀNH CÔNG] - Link đã được giải mã:<br><a href="${simulatedResult}" target="_blank" style="color: #ff99ff;">${simulatedResult}</a></span><br>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }, 2500);
        }
    </script>
</body>
</html>
